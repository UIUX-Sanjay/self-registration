<main class="page">
  <header class="page-header">
    <img src="/assets/calm 1.png" alt="Calms Technologies" class="logo" />
    <h1>Calms Technologies</h1>
  </header>

  <section class="layout">
    <div class="left">
      <h2>
        <span class="accent">Equipment</span>
        <span>Movement</span>
      </h2>
      <p>Please declare any prohibited items that will be carried into or out of the premises.</p>
      <div class="illustration">
        <img src="/assets/item.png" alt="Equipment movement illustration" />
      </div>
    </div>

    <div class="divider"></div>

    <div class="right">
      <form class="form" [formGroup]="form" (ngSubmit)="addItem()">
        <label class="field">
          <span class="label">Item Description</span>
          <input type="text" formControlName="itemDescription" placeholder="Enter the item description" />
        </label>
        <label class="field">
          <span class="label">Serial Number</span>
          <input type="text" formControlName="serialNumber" placeholder="Enter the serial number" />
        </label>
        <label class="field">
          <span class="label">Direction</span>
          <div class="select-wrap">
            <select formControlName="direction">
              <option value="" disabled>In or out</option>
              <option value="IN">In</option>
              <option value="OUT">Out</option>
            </select>
          </div>
        </label>
        <button class="btn-outline" type="button" (click)="addItem()" [disabled]="form.invalid">
          Add
          <span class="add-icon">
            <svg
              class="w-6 h-6 text-gray-800 dark:text-white"
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              fill="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                fill-rule="evenodd"
                d="M2 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10S2 17.523 2 12Zm11-4.243a1 1 0 1 0-2 0V11H7.757a1 1 0 1 0 0 2H11v3.243a1 1 0 1 0 2 0V13h3.243a1 1 0 1 0 0-2H13V7.757Z"
                clip-rule="evenodd"
              />
            </svg>
          </span>
        </button>
      </form>

      <div class="list" *ngIf="items.length > 0">
        <div class="list-title">Add item</div>
        <div class="list-items">
          <div class="item" *ngFor="let item of items; let i = index; trackBy: trackByIndex">
            <div class="item-name">{{ item.name }}</div>
            <div class="badge" [ngClass]="{ in: item.direction === 'IN' }">
              <span class="arrow">{{ item.direction === 'IN' ? '▼' : '▲' }}</span>
              {{ item.direction }}
            </div>
            <button class="delete" type="button" (click)="removeItem(i)" aria-label="Delete">
              <svg
                aria-hidden="true"
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                fill="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  fill-rule="evenodd"
                  d="M8.586 2.586A2 2 0 0 1 10 2h4a2 2 0 0 1 2 2v2h3a1 1 0 1 1 0 2v12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V8a1 1 0 0 1 0-2h3V4a2 2 0 0 1 .586-1.414ZM10 6h4V4h-4v2Zm1 4a1 1 0 1 0-2 0v8a1 1 0 1 0 2 0v-8Zm4 0a1 1 0 1 0-2 0v8a1 1 0 1 0 2 0v-8Z"
                  clip-rule="evenodd"
                />
              </svg>
            </button>
          </div>
        </div>
      </div>

      <div class="actions">
        <div class="actions-left">
          <button class="btn grey" type="button">
            <span class="icon-left">←</span> Back
          </button>
          <button class="btn grey" type="button">
            Skip <span class="icon-right">→</span>
          </button>
        </div>
        <button class="btn yellow" type="button">
          Continue <span class="icon-right">→</span>
        </button>
      </div>
    </div>
  </section>
</main>
