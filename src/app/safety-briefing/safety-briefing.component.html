<main class="page">
  <header class="page-header">
    <img class="logo" [src]="logoUrl" alt="Calms Technologies" />
    <h1>Calms Technologies</h1>
  </header>

  <section class="title">
    <h2>
      <span class="accent">Safety</span>
      <span class="dark">Briefing</span>
    </h2>
    <p>Please watch the safety briefing video in its entirety before proceeding.</p>
  </section>

  <section class="video-card">
    <div class="video-inner">
      <button
        *ngIf="!isPlaying"
        type="button"
        class="video-thumb"
        (click)="playVideo()"
        aria-label="Play safety briefing"
      >
        <img [src]="thumbnailUrl" alt="Safety briefing thumbnail" />
        <span class="play-button" aria-hidden="true">
          <span class="play-triangle"></span>
        </span>
      </button>

      <video
        *ngIf="isPlaying"
        class="video-player"
        [src]="videoUrl"
        controls
        autoplay
        (ended)="onVideoEnded()"
      ></video>
    </div>
  </section>

  <section class="actions">
    <button class="btn grey" type="button">
      <span class="icon-left">←</span> Back
    </button>
    <button class="btn yellow" type="button" [disabled]="!isVideoCompleted">
      Continue <span class="icon-right">→</span>
    </button>
  </section>
</main>
