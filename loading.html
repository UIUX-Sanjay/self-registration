<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pacman Loader</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ececec;
      font-family: Arial, sans-serif;
    }

    .loader {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pacman {
      position: relative;
      width: 56px;
      height: 56px;
    }

    .pacman .top,
    .pacman .bottom {
      position: absolute;
      left: 0;
      width: 56px;
      height: 28px;
      background: #f2c300;
    }

    .pacman .top {
      top: 0;
      border-radius: 56px 56px 0 0;
      transform-origin: center bottom;
      animation: topMouth 0.45s infinite ease-in-out;
    }

    .pacman .bottom {
      bottom: 0;
      border-radius: 0 0 56px 56px;
      transform-origin: center top;
      animation: bottomMouth 0.45s infinite ease-in-out;
    }

    .dots {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-left: -2px;
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #f2c300;
      animation: dotFeed 1s infinite linear;
    }

    .dot:nth-child(2) {
      animation-delay: 0.25s;
    }

    .dot:nth-child(3) {
      animation-delay: 0.5s;
    }

    .dot:nth-child(4) {
      animation-delay: 0.75s;
    }

    @keyframes topMouth {
      0%, 100% {
        transform: rotate(0deg);
      }
      50% {
        transform: rotate(-35deg);
      }
    }

    @keyframes bottomMouth {
      0%, 100% {
        transform: rotate(0deg);
      }
      50% {
        transform: rotate(35deg);
      }
    }

    @keyframes dotFeed {
      0% {
        transform: translateX(0);
        opacity: 1;
      }
      100% {
        transform: translateX(-34px);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="loader">
    <div class="pacman">
      <div class="top"></div>
      <div class="bottom"></div>
    </div>

    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>
</body>
</html>
